# Use F12 passthrough to reach a nested tmux with the same C-a prefix.
unbind -q C-b
set -g prefix C-a
bind C-a send-prefix

# Input and focus behavior
set -g repeat-time 300
set -g focus-events on
set -s extended-keys on
set -g display-time 1500
set -g display-panes-time 1000

# start first window and pane at 1, not zero
set -g base-index 1
set -g pane-base-index 1

# bind M-r to reloading the config file
bind -n M-r source-file ~/.tmux.conf \; display "Reloaded tmux config file."

# better mnemonics for splitting panes!
bind | split-window -h
bind - split-window -v

# vim/xmonad style bindings for pane movement
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

bind-key -n M-j select-pane -t :.+1
bind-key -n M-k select-pane -t :.-1

bind-key -n M-space next-layout

# vim/xmonad style bindings for window movement
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# shift-movement keys will resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# XMonad-style stable window slots: select a slot or create it if absent.
bind-key -T root M-1 run-shell 'tmux select-window -t :1 2>/dev/null || tmux new-window -t :1'
bind-key -T root M-2 run-shell 'tmux select-window -t :2 2>/dev/null || tmux new-window -t :2'
bind-key -T root M-3 run-shell 'tmux select-window -t :3 2>/dev/null || tmux new-window -t :3'
bind-key -T root M-4 run-shell 'tmux select-window -t :4 2>/dev/null || tmux new-window -t :4'
bind-key -T root M-5 run-shell 'tmux select-window -t :5 2>/dev/null || tmux new-window -t :5'
bind-key -T root M-6 run-shell 'tmux select-window -t :6 2>/dev/null || tmux new-window -t :6'
bind-key -T root M-7 run-shell 'tmux select-window -t :7 2>/dev/null || tmux new-window -t :7'
bind-key -T root M-8 run-shell 'tmux select-window -t :8 2>/dev/null || tmux new-window -t :8'
bind-key -T root M-9 run-shell 'tmux select-window -t :9 2>/dev/null || tmux new-window -t :9'
bind-key -T root M-enter split-window \; select-layout
bind-key -T root M-C confirm-before -p 'Kill pane #P? (y/n)' 'kill-pane \; select-layout'

# Applications inside tmux must see tmux's capabilities, not Ghostty's.
# tmux uses the attaching client's TERM separately for terminal detection.
set -g default-terminal "tmux-256color"

# Preserve tmux's built-in feature table and add capabilities for this stack.
set -as terminal-features ',xterm-ghostty:RGB:clipboard:ccolour:cstyle:extkeys:focus:hyperlinks:sync:title:usstyle'
set -as terminal-features ',tmux-256color:RGB:clipboard:ccolour:cstyle:extkeys:focus:hyperlinks:title:usstyle'

# Nested tmux clients wrap clipboard writes so the outer tmux cannot drop them
# while redrawing the SSH pane.
set -as terminal-overrides ',tmux-256color:Ms=\EPtmux;\E\E]52;%p1%s;%p2%s\007\E\\'

# Distinguish the local and remote tmux layers at a glance.
if-shell 'test "$(uname)" = "Darwin"' \
  'set -g status-style fg=white,bg=colour0; set -g pane-active-border-style fg=green; set -g @layer-label MAC; set -g @layer-colour green' \
  'set -g status-style fg=white,bg=colour17; set -g pane-active-border-style fg=cyan; set -g @layer-label LINUX; set -g @layer-colour cyan'
set -g window-status-style fg=colour250,bg=default,dim
set -g window-status-current-style fg=white,bg=default,bold
set -g pane-border-style fg=colour8,bg=default
set -g message-style fg=white,bg=colour0,bold

# The status only displays minute precision, so avoid needless redraws.
set -g status-interval 60
set -g status-justify centre
set -g status-left-length 60
set -g status-right-length 50
set -g status-left "#[fg=#{@layer-colour},bold]#{@layer-label} #[fg=white,nobold]#S | #[fg=yellow]#I:#P #{?#{==:#{client_key_table},off},#[fg=black,bg=red,bold] PASS #[default],}"
set -g status-right "#[fg=white]#h | #[fg=cyan]%Y-%m-%d %H:%M"

# Activity-heavy development panes should not generate global alerts.
set -g monitor-activity off
set -g visual-activity off

# Ghostty clipboard integration with OSC 52 support
# Ghostty has excellent clipboard support - enable all features
set -g set-clipboard on
# The macOS outer tmux must relay nested writes even during pane redraws.
# "all" permits passthrough from background panes; Linux keeps the narrower mode.
if-shell 'test "$(uname)" = "Darwin"' \
  'set -g allow-passthrough all' \
  'set -g allow-passthrough on'

# OSC 52 is the only copy transport; avoid host display dependencies.
set -s copy-command ''

# Enhanced copy mode settings
set -g word-separators ' @"=()[]{}:,.'
set -g copy-mode-match-style 'bg=cyan,fg=black'
set -g copy-mode-current-match-style 'bg=magenta,fg=black'

# Vim-style selection with consistent exit-after-copy behavior.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape send-keys -X clear-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

#navigate the buffer with vi keybindings 
setw -g mode-keys vi

# Toggle pane logging into a dedicated state directory with a shell-safe name.
bind P pipe-pane -o 'mkdir -p "$HOME/.local/state/tmux/logs"; exec cat >>"$HOME/.local/state/tmux/logs/pane-#{pane_pid}.log"' \; display-message 'Toggled logging for #{pane_id}'

# Keep enough scrollback for build, test, and Kubernetes output.
set -g history-limit 100000
set -g renumber-windows off
set -g detach-on-destroy off

# Modern mouse support optimized for Ghostty. tmux's default drag, double-click,
# and triple-click bindings already copy and leave copy mode.
set -g mouse on

# F12 toggle for nested tmux with prominent visual feedback.
bind -T root F12  \
    set prefix None \;\
    set key-table off \;\
    set status-style fg=black,bg=red \;\
    set window-status-current-style fg=black,bg=red,bold \;\
    set status-right "#[fg=black,bg=red,bold] ◉ REMOTE MODE ◉ #[fg=white,bg=red]#h | %H:%M" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    display-message "Switched to REMOTE mode - press F12 to return" \;\
    refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u status-right \;\
  display-message "Returned to LOCAL mode" \;\
  refresh-client -S
